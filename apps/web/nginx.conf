# SPA (React Router, historico via BrowserRouter): qualquer caminho que nao
# seja um arquivo real do build cai em index.html, e o roteamento client-side
# assume dali. /api e /uploads nunca chegam aqui - o Traefik roteia direto
# para o container da api (ver docker-compose.production.yml / dynamic.yml).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash no nome do arquivo (Vite): cache longo e seguro, um deploy novo
    # gera nomes novos em vez de reescrever o conteudo de um nome ja em cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
